<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Counter</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;

            display: flex;

            background-color: black;
        }

        .container {
            flex-grow: 1;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            height: 2rem;
            width: 10rem;
        }
    </style>

</head>

<body>
    <div class="container">
        <button onclick="incrementCounter()" id="counter">Count</button>
    </div>

    <script>
        let count = 0;
        function incrementCounter() {
            count++;
            document.getElementById('counter').innerText = `Count: ${count}`;
        }
    </script>
</body>

</html>
